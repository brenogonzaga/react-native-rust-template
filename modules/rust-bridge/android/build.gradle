plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

android {
  namespace "expo.modules.rustbridge"

  defaultConfig {
    versionName "1.0.0"
    ndk {
      // Must stay in sync with ANDROID_ABIS in scripts/setup.js.
      abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
    }
  }
}
